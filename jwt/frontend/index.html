<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario con validación en HTML y JS - Uso de autenticación con JWT</title>
</head>

<body>
    <form id="formulario">
        <h2 id="formTitle">Registro de Usuario</h2>

        <div class="form-group">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" required>
            <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" name="email" required>
            <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <div style="position: relative;">
                <input type="password" id="password" name="password" required>
                <span id="togglePassword"
                    style="right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;">👁️</span>
            </div>
            <div class="error-message" id="passwordError"></div>
        </div>

        <button type="submit" id="submitBtn">Registrar</button>
        <p id="toggleText">¿Ya tienes cuenta? <span id="toggleLink" style="color:blue; cursor:pointer;">Inicia
                sesión</span></p>
    </form>


    <script type="module" src="script.js"></script>

</body>

</html>
