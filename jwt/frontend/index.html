<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario Profesional - Portfolio</title>
</head>
<body>
    <div class="container">
        <form id="formulario" class="form-card">
            <h2 id="formTitle">Registro de Usuario</h2>

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>
                <div class="error-message" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
                <div class="error-message" id="emailError"></div>
            </div>

            <div class="form-group password-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
                <span id="togglePassword" class="toggle-password">👁️</span>
                <div class="error-message" id="passwordError"></div>
            </div>

            <button type="submit" id="submitBtn">Registrar</button>

            <p class="toggle-text">
                <a href="#" id="toggleLink">¿Ya tienes cuenta? Inicia sesión</a>
                <p style="color: red;">FALTA ENTEDER BIEN COMO Y PARA QUE SE USAR EL TOKEN</p>
            </p>
        </form>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
